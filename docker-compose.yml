services:
  database:
    image: postgres:16-alpine
    container_name: smart-parking-db
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_parking}
      POSTGRES_USER: ${DB_USER:-smart_parking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smart_parking}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
